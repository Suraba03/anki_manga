name = "anki-manga-free"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[vars]
DAILY_PER_INSTALL = "100"
DAILY_PER_IP = "300"
# Paid calls that gave no explanation (the model declined, or its answer was unusable) cost money but use no other
# quota, so they have their own per-IP daily ceiling.
DAILY_FAILED_PER_IP = "20"
MONTHLY_CAP_USD = "10"
# One UTC day's spend above this (USD) alerts the owner once (abuse or a bug). Optional: without it, a quarter of the
# monthly cap. 2.5 is about 7x a normal day at the cap.
DAILY_ALERT_USD = "2.5"
# USD per token, DeepSeek Flash at PEAK rates (the dearer ones, so the cap errs on the safe side).
# Source: https://api-docs.deepseek.com/quick_start/pricing (checked 2026-11-01), per 1M tokens:
# cache hit $0.006, cache miss $0.30, output $1.20. Off-peak is half of that.
# VERIFY before deploy: re-check the page and the model name below.
PRICE_IN_HIT = "0.000000006"
PRICE_IN_MISS = "0.0000003"
PRICE_OUT = "0.0000012"
# The model name the pricing page lists (the extension's own-key default is the same).
# VERIFY before deploy that it is still current.
LLM_MODEL = "deepseek-flash"
# Comma-separated exact origins. First the Chrome Web Store build; then, TEMPORARILY, the owner's two unpacked
# development builds (one per checkout folder), to be removed later. An unpacked build's ID comes from its folder's
# absolute path (SHA-256, first 32 hex digits mapped 0-f to a-p), so it changes when the folder moves.
# "chrome-extension://*" (any extension) is still understood by originAllowed but must not ship.
ALLOWED_ORIGINS = "chrome-extension://bgfnpifeeclmpfdcahphaiahgafjppeo,chrome-extension://aimemjiaackefknhadaljaoneahoaefd,chrome-extension://mbcjdgjmpgkoiccnblkhkfjpdaclgihm"
# "1" lets requests without an Origin header through (curl). Keep "0" in production;
# the local smoke test sets it with: wrangler dev --var ALLOW_NO_ORIGIN:1
ALLOW_NO_ORIGIN = "0"

[[d1_databases]]
binding = "DB"
database_name = "anki-manga"
# The owner's D1 database (`npx wrangler d1 create anki-manga`). Not a secret: useless without the Cloudflare account.
database_id = "a25aee26-42b1-434f-800e-330a1c17b44d"

# Secrets (npx wrangler secret put ...): DEEPSEEK_API_KEY, IP_SALT. Never put them in this file.
# Spend alerts (src/alerts.js) also need two secrets, otherwise they are only logged:
#   npx wrangler secret put TELEGRAM_BOT_TOKEN   (from @BotFather)
#   npx wrangler secret put TELEGRAM_CHAT_ID     (your chat with the bot; send it a message first)
# The D1 tables spend_days and alerts come from schema.sql: re-run it once on the existing database
#   npx wrangler d1 execute anki-manga --remote --file schema.sql
# Test the alert locally: put the two secrets as lines TELEGRAM_BOT_TOKEN=... and TELEGRAM_CHAT_ID=... in
# server/.dev.vars (git-ignored), run `npm run dev:alerts`, then
#   curl -X POST http://localhost:8787/dev/test-alert
# The route exists only with DEV_ROUTES=1, which dev:alerts sets; never put it in [vars].

# Daily retention cleanup (src/prune.js), 03:17 UTC.
[triggers]
crons = ["17 3 * * *"]
