[project]
name = "anki-manga-helper"
version = "0.1.0"
description = "Local helper for the anki_manga Chrome extension: manga bubble OCR, furigana, DeepSeek explanations, AnkiConnect."
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10,<3.13"
dependencies = [
    "mokuro==0.2.5",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
anki-manga-helper = "anki_manga_helper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anki_manga_helper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["models: tests that load the real detector/OCR models (need ANKI_MANGA_SAMPLES)"]
